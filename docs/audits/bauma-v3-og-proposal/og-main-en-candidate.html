<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BAUMA — main OG image, English</title>
<!--
  Candidate for the main Open Graph image, 1200 x 630.
  Typography is the Home hero's: DM Serif Display 400, tracking -0.025em, line-height 1,
  italic for the last word. The font files are the very ones next/font serves on Home
  (copied unchanged into ./fonts). The wordmark is public/logo/bauma-logo.svg, unchanged, inverted to white with the same CSS filter the Home header uses.
  Colours: base #080808 (the Home hero / body base), text #ffffff, accent #7c97f0
  (the Home eyebrow blue; Home's royal blue #4169e1 is the CTA fill, too dark for text on this base).
  Export: node export.cjs (see README.md). Not linked from the site.
-->
<style>
  @font-face{font-family:"DM Serif Display";font-style:normal;font-weight:400;font-display:block;
    src:url("fonts/DMSerifDisplay-normal-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"DM Serif Display";font-style:normal;font-weight:400;font-display:block;
    src:url("fonts/DMSerifDisplay-normal-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:"DM Serif Display";font-style:italic;font-weight:400;font-display:block;
    src:url("fonts/DMSerifDisplay-italic-latin-ext.woff2") format("woff2");
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
  @font-face{font-family:"DM Serif Display";font-style:italic;font-weight:400;font-display:block;
    src:url("fonts/DMSerifDisplay-italic-latin.woff2") format("woff2");
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  :root{--base:#080808;--text:#ffffff;--accent:#7c97f0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;background:var(--base);overflow:hidden}
  .og{position:relative;width:1200px;height:630px;background:var(--base);color:var(--text);overflow:hidden}
  .mark{position:absolute;left:80px;top:72px;display:block;width:132px;height:auto;filter:invert(1)}
  h1{position:absolute;left:80px;bottom:72px;width:1040px;
     font-family:"DM Serif Display",serif;font-weight:400;font-size:112px;line-height:1;
     letter-spacing:-0.025em;font-kerning:normal;font-optical-sizing:none;text-rendering:geometricPrecision;
     -webkit-font-smoothing:antialiased}
  h1 span.line{display:block;white-space:nowrap}
  h1 em{font-style:italic;color:var(--accent)}
</style>
</head>
<body>
<main class="og">
  <img class="mark" src="assets/bauma-logo.svg" alt="Bauma">
  <h1>
    <span class="line">Websites that</span>
    <span class="line">help you win</span>
    <span class="line">new <em>clients.</em></span>
  </h1>
</main>
</body>
</html>
